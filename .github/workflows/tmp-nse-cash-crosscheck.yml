name: TEMP NSE cash cross-check

# Temporary, removed before the PR: prints NSE's own daily files for the cash
# days being corrected. Read-only, no secrets.
on:
  push:
    branches: ['claude/funny-lovelace-270am2']
    paths:
      - 'scripts/_tmp_nse_cash_crosscheck.py'
      - '.github/workflows/tmp-nse-cash-crosscheck.yml'

permissions:
  contents: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet "curl_cffi>=0.7.0"
      - run: python scripts/_tmp_nse_cash_crosscheck.py
