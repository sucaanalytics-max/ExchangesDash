name: Brokers Mirror

# Clones Tusk's brokers-dashboard tables (sb_*, Supabase project everjfpbnlbcpuarnhob, written by
# abiyani-tools/brokersdashboard) into this repo's Supabase project (NSE-BSE): scripts/brokers_mirror.py.
# Their side is read with their publishable key only. Commits nothing, so Vercel never builds for it.
#
# Setup, once (docs/BROKERS_INTEGRATION.md):
#   1. secret BROKERS_SUPABASE_KEY = their publishable key
#   2. brokers_mirror_schema.sql (committed; applied to NSE-BSE on 3 Nov 2026). Mode "emit-ddl" only
#      works with a key that can read their schema endpoint, which the publishable key cannot.
#   3. repository variable ENABLE_BROKERS_MIRROR = true; then it runs every weekday after their job
# Optional: repository variable BROKERS_SUPABASE_URL if their project moves.
#
# Vercel Cron starts both slots on time (dashboard/api/trigger-scheduled.js, workflow_dispatch with
# mode: mirror). GitHub runs the schedule below hours late, so it is only the fallback; a repeat copy
# is a harmless upsert. Keep these crons equal to the brokers-mirror slots in that file.
#
# A copy reads only what changed: tables keyed on run_id copy new or changed engine runs and recheck each
# broker's latest run; the small tables are copied whole. Mode "full" (manual) re-reads and re-upserts
# every row of every table, to repair a copy that has drifted.

on:
  schedule:
    # 15:02 UTC Mon–Fri: after their daily job is due (14:17 UTC)
    - cron: '2 15 * * 1-5'
    # 23:32 UTC Mon–Fri: their job runs on GitHub's schedule too, and has published as late as 22:49 UTC
    - cron: '32 23 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'mirror: copy what changed; full: re-copy every row (resync); emit-ddl: their table definitions as SQL (artifact)'
        required: false
        default: 'mirror'
        type: choice
        options:
          - mirror
          - full
          - emit-ddl

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mirror:
    # Scheduled runs only once the mirror is switched on; manual runs always
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_BROKERS_MIRROR == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30    # a full resync took ~7 min on 9 Nov 2026 and grows with every run
    env:
      BROKERS_SUPABASE_URL: ${{ vars.BROKERS_SUPABASE_URL }}
      BROKERS_SUPABASE_KEY: ${{ secrets.BROKERS_SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Their table definitions as SQL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'emit-ddl' }}
        run: python scripts/brokers_mirror.py --emit-ddl out/brokers_mirror_schema.sql

      - name: Keep the SQL for review
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'emit-ddl' }}
        uses: actions/upload-artifact@v4
        with:
          name: brokers-mirror-schema
          path: out/brokers_mirror_schema.sql
          retention-days: 30

      - name: Copy the tables
        if: ${{ (github.event_name == 'schedule' || inputs.mode == 'mirror' || inputs.mode == 'full') && vars.ENABLE_BROKERS_MIRROR == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "full" ]; then
            python scripts/brokers_mirror.py --full
          else
            python scripts/brokers_mirror.py
          fi

      - name: Mirror is off
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'mirror' || inputs.mode == 'full') && vars.ENABLE_BROKERS_MIRROR != 'true' }}
        run: |
          echo "::notice title=Brokers mirror off::Set the repository variable ENABLE_BROKERS_MIRROR to true once brokers_mirror_schema.sql is applied."
